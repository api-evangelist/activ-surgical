aid: activ-surgical
name: Activ Surgical
description: 'Activ Surgical is a Boston, Massachusetts digital surgery company building
  intraoperative surgical intelligence for the operating room. Its flagship product,
  the ActivSight Intelligent Light imaging module, attaches to existing laparoscopic
  and robotic surgical systems and renders augmented-reality overlays on a standard
  monitor, letting surgeons see physiology the naked eye cannot. ActivPerfusion delivers
  dye-free, real-time blood-perfusion imaging using laser speckle contrast imaging,
  while ActivICG supports conventional indocyanine green visualization of structures
  such as bile ducts. The module is powered by the ActivEdge platform, a hardware-agnostic
  computer-vision, AI and machine-learning stack the company is building to turn
  intraoperative data into real-time surgical guidance. Activ Surgical performed the
  first autonomous robotic soft-tissue surgery in 2018, received FDA 510(k) clearance
  for ActivSight in April 2021 and CE Mark approval in December 2022, and sells on a
  subscription model with no capital-equipment purchase. The company publishes no
  public developer program, API, SDK or machine-readable API contract as of this
  profiling pass; its public technical surface is regulatory (EU MDR declarations of
  conformity, ISO 13485:2016) and clinical (peer-reviewed studies and white papers).'
